# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "1e4e681072312f665cb59b2bc19e6fb9"
name = "MultiChannel Commerce-2"
application_url = "https://multichannel-commerce-hoee.onrender.com"
embedded = false

[build]
automatically_update_urls_on_dev = true

[webhooks]
api_version = "2024-07"

  [[webhooks.subscriptions]]
  uri = "https://multichannel-commerce-hoee.onrender.com/api/integrations/shopify/webhooks"
  topics = [
    "products/create",
    "products/update",
    "inventory_levels/update"
  ]

[access_scopes]
# Required scopes for product and inventory synchronization
scopes = "read_products,write_products,read_inventory,write_inventory"

[auth]
redirect_urls = [
  "https://multichannel-commerce-hoee.onrender.com/api/integrations/shopify/callback",
  "http://localhost:3000/api/integrations/shopify/callback"
]
